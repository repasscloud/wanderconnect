# ENABLED by the owner, 10 November 2026 (D359): "build the images on GitHub" to deploy UAT. Manual dispatch only:
# Actions -> Images -> Run workflow. Public repository, so standard and arm64 runners use no paid minutes.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with
# Read & Write on the repasscloud/swoovr-* repositories only). Create those repositories as PRIVATE first:
# a push to a missing repository creates it with the namespace default visibility.
#
# Builds the five Swoovr images from ONE commit for linux/amd64 AND linux/arm64 on GitHub-hosted Ubuntu
# runners, natively per architecture (no QEMU), and publishes one multi-arch index per image:
#   repasscloud/swoovr-api:<commit>      repasscloud/swoovr-web:<commit>      repasscloud/swoovr-admin:<commit>
#   repasscloud/swoovr-operator:<commit> repasscloud/swoovr-keycloak:<commit>
# <commit> is the full 40-character Git SHA. No mutable tag (latest, main, uat) is ever pushed.
# Deploy by digest (repo@sha256:...), never by tag: release-manifest.env/json and the Vultr bundle carry digests.
# Plan and owner gates: docs/delivery/UAT-VULTR-IMAGES-AND-BUNDLE-PLAN-2026-11-10.md.
# Every action is pinned to a full commit SHA (the tag is only a comment), since the build job holds the
# Docker Hub push token and the promote job holds Azure credentials.
#
# The optional promote-to-azure job copies the SAME digests into the production Azure Container Registry
# (az acr import, no rebuild). It is off unless the dispatch input asks for it and the "production" GitHub
# environment approves. Production stays Azure (D355); UAT runs on the Vultr bare-metal host.
#
name: Images
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional product version X.Y.Z for the Keycloak theme (D320). Empty keeps the committed value."
        required: false
        default: ""
      promote_to_azure:
        description: "Also import these digests into the production ACR (needs production environment approval)."
        type: boolean
        default: false
concurrency:
  group: swoovr-images-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  REGISTRY_NAMESPACE: repasscloud
jobs:
  # Fails once, with a clear message, before ten build runners start, when the Docker Hub secrets are missing.
  preflight:
    name: Check Docker Hub secrets
    runs-on: ubuntu-24.04
    steps:
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [[ -n "$DOCKERHUB_USERNAME" ]] || missing+=" DOCKERHUB_USERNAME"
          [[ -n "$DOCKERHUB_TOKEN" ]] || missing+=" DOCKERHUB_TOKEN"
          if [[ -n "$missing" ]]; then
            echo "::error::Missing repository secret(s):${missing}. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

  build:
    name: ${{ matrix.component }} (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        component: [api, web, admin, operator, keycloak]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - component: api
            dockerfile: containers/uat/Dockerfile
          - component: web
            dockerfile: containers/uat/Dockerfile
          - component: admin
            dockerfile: containers/uat/Dockerfile
          - component: operator
            dockerfile: containers/uat/Dockerfile
          - component: keycloak
            dockerfile: containers/uat/Keycloak.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate the optional version input
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ -z "$VERSION" || "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z" >&2; exit 1; }'
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SWOOVR_VERSION=${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=swoovr-${{ matrix.component }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY_NAMESPACE }}/swoovr-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the per-architecture digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.component }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 7
          if-no-files-found: error

  merge:
    name: Publish multi-arch indexes
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create one index per image, tagged with the commit
        id: manifest
        run: |
          set -euo pipefail
          : > release-manifest.env
          echo "SWOOVR_COMMIT=${GITHUB_SHA}" >> release-manifest.env
          for component in api web admin operator keycloak; do
            repo="${REGISTRY_NAMESPACE}/swoovr-${component}"
            docker buildx imagetools create --tag "${repo}:${GITHUB_SHA}" \
              "${repo}@$(cat "digests/${component}-amd64")" \
              "${repo}@$(cat "digests/${component}-arm64")"
            index=$(docker buildx imagetools inspect "${repo}:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')
            # Refuse an index that does not carry both platforms.
            platforms=$(docker buildx imagetools inspect "${repo}@${index}" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            echo "$platforms" | grep -q 'linux/amd64' && echo "$platforms" | grep -q 'linux/arm64'
            upper=$(echo "$component" | tr '[:lower:]' '[:upper:]')
            echo "SWOOVR_${upper}_IMAGE=docker.io/${repo}@${index}" >> release-manifest.env
          done
          python3 deploy/vultr-uat/bin/manifest-json.py release-manifest.env > release-manifest.json
          cat release-manifest.env >> "$GITHUB_STEP_SUMMARY"
          echo "manifest=$(base64 -w0 release-manifest.env)" >> "$GITHUB_OUTPUT"
      - name: Package the Vultr UAT deployment bundle for this commit
        run: ./deploy/vultr-uat/bin/make-bundle.sh release-manifest.env dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swoovr-release-${{ github.sha }}
          path: |
            release-manifest.env
            release-manifest.json
            dist/*.tar.gz
          retention-days: 30
          if-no-files-found: error

  promote-to-azure:
    name: Import the same digests into production ACR
    if: ${{ inputs.promote_to_azure }}
    needs: merge
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: az acr import by digest (no rebuild; Container Apps pulls linux/amd64 from the index)
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MANIFEST: ${{ needs.merge.outputs.manifest }}
        run: |
          set -euo pipefail
          echo "$MANIFEST" | base64 -d > release-manifest.env
          # Production Keycloak needs a production-origin build (see plan, "Keycloak image is environment-specific").
          for component in api web admin operator; do
            upper=$(echo "$component" | tr '[:lower:]' '[:upper:]')
            source=$(grep "^SWOOVR_${upper}_IMAGE=" release-manifest.env | cut -d= -f2-)
            az acr import --name "$ACR_NAME" --source "$source" --image "swoovr-${component}:${GITHUB_SHA}" \
              --username "$DOCKERHUB_USERNAME" --password "$DOCKERHUB_TOKEN" --force
          done

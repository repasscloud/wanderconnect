#
# Builds the five Swoovr images from ONE commit for linux/amd64 AND linux/arm64 on GitHub-hosted Ubuntu
# runners, natively per architecture (no QEMU), and publishes one multi-arch index per image:
#   repasscloud/swoovr-api:<commit>      repasscloud/swoovr-web:<commit>      repasscloud/swoovr-admin:<commit>
#   repasscloud/swoovr-operator:<commit> repasscloud/swoovr-keycloak:<commit>
# <commit> is the full 40-character Git SHA. No mutable tag (latest, main, uat) is ever pushed.
# Deploy by digest (repo@sha256:...), never by tag: release-manifest.env/json and the Vultr bundle carry digests.
# Plan and owner gates: docs/delivery/UAT-VULTR-IMAGES-AND-BUNDLE-PLAN-2026-11-10.md.
#
# The optional promote-to-azure job copies the SAME digests into the production Azure Container Registry
# (az acr import, no rebuild). It is off unless the dispatch input asks for it and the "production" GitHub
# environment approves. Production stays Azure (D355); UAT runs on the Vultr bare-metal host.

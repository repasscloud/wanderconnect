# Swoovr/Keycloak PostgreSQL: TLS-only network logins with SCRAM. Unix socket stays inside the container
# (used by the image entrypoint during first initialisation and by the healthcheck).
local   all   all                     trust
hostssl all   all   0.0.0.0/0         scram-sha-256
hostssl all   all   ::/0              scram-sha-256
host    all   all   0.0.0.0/0         reject
host    all   all   ::/0              reject

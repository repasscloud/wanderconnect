# Swoovr sign-in theme: Standard (black and white) only, light/dark from the device.
# Written for the keycloak.v2 login theme (Keycloak 25/26, PatternFly 5).
# Check `styles` against your version's themes/keycloak.v2/login/theme.properties and keep its entries first.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/swoovr.css
darkMode=true
locales=en

# Text reveal control instead of the Font Awesome eye (no icon font download); see field.ftl and swoovr.css.
kcFormPasswordVisibilityIconShow=sw-show
kcFormPasswordVisibilityIconHide=sw-hide
# Shown under the claims line on every sign-in page.
swoovrVersion=v0.1.0-dev

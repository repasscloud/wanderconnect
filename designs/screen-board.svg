style="fill:#FFFFFF">Express interest     |     Request to chat</text><text x="55" y="1000" class="h">04 · Boundaries &amp; privacy</text><rect x="55" y="1020" width="455" height="790" rx="24" fill="#FAF8F4" stroke="#c7ccc8"/><text x="77" y="1055" class="b">WanderConnect</text><text x="77" y="1094" class="h">04 · Boundaries &amp; privacy</text><text x="77" y="1130" class="h">My profile visibility</text><text x="77" y="1163" class="b">Require intentions: ANY / ALL</text><rect x="77" y="1179" width="407" height="42" rx="12" fill="#E2F0EB" stroke="#D8DFDA"/><text x="89" y="1206" class="b">Selected: Long-term relationship</text><text x="77" y="1255" class="b">Exclude intentions: any match fails</text><rect x="77" y="1271" width="407" height="61" rx="12" fill="#E2F0EB" stroke="#D8DFDA"/><text x="89" y="1296" class="b">Casual connection</text><text x="89" y="1317" class="b">Friends with benefits</text><text x="77" y="1370" class="b">Allow incognito visitors                  OFF</text><text x="77" y="1410" class="b">Browse incognito                              ON</text><text x="77" y="1451" class="b">Hide sparse profiles                          ON</text><text x="77" y="1491" class="b">Visitors: Current / Upcoming / Neither</text><text x="77" y="1539" class="h">Contact: Message requests</text><text x="77" y="1568" class="s">Alternative: mutual interest first</text><text x="77" y="1625" class="s">Exclusions override shared intentions.</text><text x="77" y="1650" class="s">Payment never overrides these boundaries.</text><rect x="77" y="1725" width="407" height="43" rx="12" fill="#075B5E" stroke="#075B5E"/><text x="92" y="1752" class="b" style="fill:#FFFFFF">Save preferences</text><text x="570" y="1000" class="h">05 · Plan &amp; venue experience</text><rect x="570" y="1020" width="455" height="790" rx="24" fill="#FAF8F4" stroke="#c7ccc8"/><text x="592" y="1055" class="b">WanderConnect</text><text x="592" y="1094" class="h">05 · Plan &amp; venue experience</text><text x="592" y="1130" class="h">Coffee with Alex</text><text x="592" y="1160" class="s">Both agree before booking is confirmed.</text><rect x="592" y="1185" width="407" height="135" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><text x="606" y="1215" class="h">Example Cafe · Coffee for two</text><text x="606" y="1246" class="b">Saturday · 10:30 · Adelaide time</text><text x="606" y="1272" class="b">Includes two coffees + shared pastry</text><text x="606" y="1298" class="s">Illustrative offer · not a live venue</text><text x="592" y="1359" class="b">Both attendees confirmed                 Yes</text><text x="592" y="1399" class="b">Payer                                         Organiser</text><text x="592" y="1439" class="b">Price                                         Demo only</text><text x="592" y="1480" class="s">Cancellation terms shown before payment.</text><rect x="592" y="1505" width="407" height="43" rx="12" fill="#075B5E" stroke="#075B5E"/><text x="607" y="1532" class="b" style="fill:#FFFFFF">Review and pay · sandbox</text><rect x="592" y="1575" width="407" height="120" rx="12" fill="#E2F0EB" stroke="#D8DFDA"/><text x="606" y="1604" class="h">Voucher wallet</text><text x="606" y="1635" class="b">Issued only after confirmed booking.</text><text x="606" y="1663" class="s">Staff scan · one server-validated redemption.</text><text x="592" y="1750" class="s">An optional experience, not a dating fee.</text><text x="1085" y="1000" class="h">06 · Private feedback</text><rect x="1085" y="1020" width="455" height="790" rx="24" fill="#FAF8F4" stroke="#c7ccc8"/><text x="1107" y="1055" class="b">WanderConnect</text><text x="1107" y="1094" class="h">06 · Private feedback</text><text x="1107" y="1130" class="h">How was your connection?</text><text x="1107" y="1162" class="s">Your answers are not shown to Alex.</text><text x="1107" y="1195" class="b">Did you meet?</text><rect x="1107" y="1207" width="407" height="40" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><text x="1117" y="1232" class="s">Yes / No / Prefer not to say</text><text x="1107" y="1283" class="b">Did their profile represent them?</text><rect x="1107" y="1295" width="407" height="40" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><text x="1117" y="1320" class="s">Yes / Partly / No</text><text x="1107" y="1371" class="b">Were your intentions aligned?</text><rect x="1107" y="1383" width="407" height="40" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><text x="1117" y="1408" class="s">Yes / Partly / No</text><text x="1107" y="1459" class="b">Were your boundaries respected?</text><rect x="1107" y="1471" width="407" height="40" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><text x="1117" y="1496" class="s">Yes / Concern / Skip</text><text x="1107" y="1547" class="b">Would you connect again?</text><rect x="1107" y="1559" width="407" height="40" rx="12" fill="#FFFFFF" stroke="#D8DFDA"/><text x="1117" y="1584" class="s">Date / Friends / Chat / No / Unsure</text><text x="1107" y="1660" class="s">Report a concern → separate review process</text><text x="1107" y="1690" class="s">No public score. Chemistry is personal.</text><rect x="1107" y="1725" width="407" height="43" rx="12" fill="#075B5E" stroke="#075B5E"/><text x="1122" y="1752" class="b" style="fill:#FFFFFF">Submit private feedback</text></svg>
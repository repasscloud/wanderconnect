# Local development ONLY. Never promote start-dev or HTTP bindings to public infrastructure.
name: swoovr-local
services:
  api:
    build:
      context: .
      dockerfile: containers/Dockerfile
      target: api
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Swoovr: Host=postgres;Database=swoovr;Username=swoovr;Password=${SWOOVR_DB_PASSWORD:?Run ./scripts/docker-local.sh init first}
      # D147: Didit test mode. Empty values leave ID verification unavailable (503) and every webhook refused.
      Didit__ApiKey: ${SWOOVR_DIDIT_API_KEY:-}
      Didit__WorkflowId: ${SWOOVR_DIDIT_WORKFLOW_ID:-}
      Didit__WebhookSecret: ${SWOOVR_DIDIT_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: containers/Dockerfile
      target: web
    ports:
      - "127.0.0.1:5081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    # This shell does not call the API or Keycloak yet; no false readiness dependency.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Run ./scripts/docker-local.sh init first}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      # Resolved by Keycloak inside the realm imports; generated by ./scripts/docker-local.sh init.
      SWOOVR_MEMBERS_WEB_SECRET: ${SWOOVR_MEMBERS_WEB_SECRET:?Run ./scripts/docker-local.sh init first}
      SWOOVR_VENUES_WEB_SECRET: ${SWOOVR_VENUES_WEB_SECRET:?Run ./scripts/docker-local.sh init first}
      SWOOVR_STAFF_WEB_SECRET: ${SWOOVR_STAFF_WEB_SECRET:?Run ./scripts/docker-local.sh init first}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./containers/keycloak/swoovr-dev-realm.json:/opt/keycloak/data/import/swoovr-dev-realm.json:ro
      - ./containers/keycloak/realms/swoovr-members-dev.json:/opt/keycloak/data/import/swoovr-members-dev.json:ro
      - ./containers/keycloak/realms/swoovr-venues-dev.json:/opt/keycloak/data/import/swoovr-venues-dev.json:ro
      - ./containers/keycloak/realms/swoovr-staff-dev.json:/opt/keycloak/data/import/swoovr-staff-dev.json:ro
      - ./containers/keycloak/themes/swoovr:/opt/keycloak/themes/swoovr:ro
    healthcheck:
      # The hardened upstream image has bash but no curl. Management stays unpublished.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  # Local mail sink: catches every Keycloak and API email; nothing is delivered. UI/API and SMTP on loopback only.
  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  # Application database (DEFAULT PostgreSQL 17). Separate from Keycloak's embedded development store.
  # Host port 5433 leaves a host PostgreSQL on 5432 alone.
  postgres:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_DB: swoovr
      POSTGRES_USER: swoovr
      POSTGRES_PASSWORD: ${SWOOVR_DB_PASSWORD:?Run ./scripts/docker-local.sh init first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "swoovr", "-d", "swoovr"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  keycloak-data:
  postgres-data:
